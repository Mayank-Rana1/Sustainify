name: sustainify_frontend
description: Sustainify AI Frontend (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  video_player: ^2.8.2
  http: ^1.2.0
  http_parser: ^4.0.2
  mime: ^1.0.4
  syncfusion_flutter_charts: ^31.1.19
  file_picker: ^8.1.2
  flutter_svg: ^2.2.3
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
